name: doyinmart
description: DoyinMart — marketplace app (Flutter). Same theme & features as the web.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0        # auth (email/OTP) + session token for the API
  http: ^1.2.0                    # REST calls to /api/mobile/*
  webview_flutter: ^4.7.0         # checkout / gift-card purchase in the hardened web flow
  cached_network_image: ^3.3.1    # low-bandwidth image caching
  intl: ^0.19.0                   # ₦ formatting
  url_launcher: ^6.2.6            # open download / WhatsApp links externally
  shared_preferences: ^2.2.3      # persist the theme choice
  shimmer: ^3.0.0                 # skeleton loaders
  share_plus: ^9.0.0              # share store / product links
  package_info_plus: ^8.0.0       # app version in settings
  connectivity_plus: ^6.0.0       # offline detection banner
  cupertino_icons: ^1.0.6
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash.png

# App launcher icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#04553e"
  adaptive_icon_foreground: "assets/icon_fg.png"
  remove_alpha_ios: true

# Native splash (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#04553e"
  image: assets/splash.png
  android_12:
    color: "#04553e"
    image: assets/splash.png
  color_dark: "#0b0b0c"
  image_dark: assets/splash.png
